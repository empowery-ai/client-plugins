schema_version: "1.1"
name: no-trigger-swift
description: >
  A native SwiftUI question is out of scope. The skill must not load for it.
tags: [scope]
execution:
  prompt: "How do I add swipe-to-delete to a List in SwiftUI?"
  max_turns: 2
  timeout_seconds: 120
graders:
  - name: skill-not-used
    type: tool_used
    tool: Skill
    min: 0
    max: 0
  - name: no-em-dash
    type: regex
    pattern: '\u2014'
    match: not_contains
